name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.validate.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Enforces docs/RELEASING.md's manual versioning rules: the tag must match
      # v<versionName> from app/build.gradle.kts, and a changelog for versionCode must exist.
      # versionCode/versionName are never derived or bumped here — only validated.
      - name: Validate tag, versionCode, and changelog
        id: validate
        run: |
          set -euo pipefail

          version_name=$(grep -oP '(?<=versionName = ")[^"]+' app/build.gradle.kts)
          version_code=$(grep -oP '(?<=versionCode = )\d+' app/build.gradle.kts)

          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "::error::Could not extract versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi

          tag_name="${GITHUB_REF#refs/tags/}"
          expected_tag="v${version_name}"

          if [ "$tag_name" != "$expected_tag" ]; then
            echo "::error::Tag '${tag_name}' does not match expected 'v<versionName>' (expected '${expected_tag}')"
            exit 1
          fi

          changelog_file="fastlane/metadata/android/en-US/changelogs/${version_code}.txt"
          if [ ! -f "$changelog_file" ]; then
            echo "::error::Missing changelog for versionCode ${version_code}: ${changelog_file}"
            exit 1
          fi

          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "changelog_file=${changelog_file}" >> "$GITHUB_OUTPUT"

      - name: Quality gate
        run: ./gradlew spotlessCheck detekt test

      - name: Decode upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/upload-keystore.jks"

      - name: Build signed APK and AAB
        env:
          UPLOAD_STORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Clean up decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/upload-keystore.jks"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.validate.outputs.changelog_file }}
          files: app/build/outputs/apk/release/app-release.apk

  deploy-play-internal:
    name: Deploy to Play internal track
    needs: release
    runs-on: ubuntu-latest
    # No-op (skipped, not failed) until Play is configured — flip on by setting the
    # ENABLE_PLAY_DEPLOY repository variable to "true" once PLAY_SERVICE_ACCOUNT_JSON exists.
    # GitHub Actions disallows referencing secrets directly in job-level `if:` conditions, so
    # gating goes through this repo variable instead of a secrets check.
    if: ${{ vars.ENABLE_PLAY_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Decode upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/upload-keystore.jks"

      - name: Decode Play service account JSON
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > "${RUNNER_TEMP}/play-service-account.json"

      - name: Build and upload to Play internal track
        env:
          UPLOAD_STORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/play-service-account.json
        run: bundle exec fastlane deploy_play_internal

      - name: Clean up decoded secrets
        if: always()
        run: rm -f "${RUNNER_TEMP}/upload-keystore.jks" "${RUNNER_TEMP}/play-service-account.json"
